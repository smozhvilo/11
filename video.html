<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відеоінструкція</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html { width:100%; height:100%; background:#000; overflow:hidden; }
    video { width:100%; height:100%; object-fit:contain; }
    .fallback {
      position:absolute; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:#fff; font-family:sans-serif; text-align:center; padding:20px;
      background:#111;
    }
    .fallback a { color:#4da6ff; text-decoration:underline; margin-top:20px; }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline loop controls>
    <source src="https://nextcloud.lk-t.com.ua:40002/index.php/f/14021" type="video/mp4">
    <source src="https://nextcloud.lk-t.com.ua:40002/index.php/f/14021" type="video/webm">
    <source src="https://nextcloud.lk-t.com.ua:40002/index.php/f/14021" type="video/ogg">
  </video>

  <div class="fallback" id="fallback" style="display:none;">
    <h2>Відео не відтворилось автоматично</h2>
    <p>Браузер блокував автоплей або файл не завантажився.</p>
    <p><a href="https://nextcloud.lk-t.com.ua:40002/index.php/f/14021" target="_blank">Натисніть тут, щоб відкрити відео</a></p>
  </div>

  <script>
    var video = document.getElementById('player');
    var fallback = document.getElementById('fallback');

    video.addEventListener('error', function() {
      fallback.style.display = 'flex';
    });

    video.addEventListener('canplay', function() {
      if (video.readyState >= 3 && !video.paused) {
        // Все ок
      }
    });

    setTimeout(function() {
      if (video.paused && fallback.style.display === 'none') {
        // Можливо, потрібно натиснути, щоб розблокувати автоплей на мобільних
      }
    }, 3000);
  </script>
</body>
</html>
